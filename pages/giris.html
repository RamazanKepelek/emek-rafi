<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Emek Rafı</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark er-navbar">
        <div class="container">
            <a class="navbar-brand" href="../index.html">🌿 Emek Rafı</a>
        </div>
    </nav>


    <main class="flex-grow-1 d-flex align-items-center py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-md-7 col-lg-5">

                    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">

                        <div class="text-center mb-4">

                            <div class="display-5 mb-3">🌿</div>

                            <h1 class="h3 mb-2">Tekrar Hoş Geldiniz</h1>

                            <p class="text-muted mb-0">
                                Emek Rafı hesabınıza giriş yapın.
                            </p>

                        </div>


                        <form class="needs-validation" novalidate>

                            <div class="form-floating mb-3">

                                <input
                                    type="email"
                                    class="form-control"
                                    id="girisEmail"
                                    placeholder="ornek@eposta.com"
                                    autocomplete="email"
                                    required
                                >

                                <label for="girisEmail">E-posta adresi</label>

                                <div class="invalid-feedback">
                                    Lütfen geçerli bir e-posta adresi girin.
                                </div>

                            </div>


                            <div class="form-floating mb-3">

                                <input
                                    type="password"
                                    class="form-control"
                                    id="girisSifre"
                                    placeholder="Şifreniz"
                                    minlength="6"
                                    autocomplete="current-password"
                                    required
                                >

                                <label for="girisSifre">Şifre</label>

                                <div class="invalid-feedback">
                                    Lütfen en az 6 karakterli bir şifre girin.
                                </div>

                            </div>


                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="beniHatirla"
                                    >

                                    <label class="form-check-label small" for="beniHatirla">
                                        Beni hatırla
                                    </label>

                                </div>

                                <a href="#" class="small text-decoration-none">
                                    Şifremi unuttum
                                </a>

                            </div>


                            <button class="btn btn-success w-100 py-2" type="submit">
                                <i class="bi bi-box-arrow-in-right me-1"></i>
                                Giriş Yap
                            </button>

                        </form>


                        <hr class="my-4">


                        <p class="text-center small mb-0">
                            Henüz hesabınız yok mu?
                            <a href="kayit.html" class="text-decoration-none">Hemen kaydolun</a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="er-footer py-4 mt-auto">
        <div class="container text-center small">
            © 2026 Emek Rafı
        </div>
    </footer>


    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="erToastContainer" style="z-index: 1080;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/script.js"></script>

</body>
</html>
